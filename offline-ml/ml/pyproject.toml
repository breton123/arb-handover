[project]
name = "firm-ml"
version = "0.1.0"
description = "V1 research loop for the arb classifier and candidate-pack ranker"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1",
    "polars>=1.30",
    "pyarrow>=19",
    "scikit-learn>=1.6",
    "lightgbm>=4.6",
    "matplotlib>=3.9",
    "jupyter>=1.1",
    "nbconvert>=7.16",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/firm_ml"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
