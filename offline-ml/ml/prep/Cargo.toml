[package]
name = "ml-prep"
version = "0.1.0"
edition = "2021"
description = "Builds ML-ready Parquet datasets from raw transactions, economics labels and candidate packs"
publish = false

[lib]
name = "ml_prep"
path = "src/lib.rs"

[[bin]]
name = "ml-prep"
path = "src/main.rs"

# Versions are pinned to what the dev box already has cached so it can build with --offline.
[dependencies]
tx-features = { path = "../../crates/tx-features" }
arrow-array = "55.2"
arrow-schema = "55.2"
parquet = { version = "55.2", default-features = false, features = ["arrow", "zstd"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
sha2 = "0.10"
bs58 = "0.5"
rayon = "1.10"
