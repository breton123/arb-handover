[package]
name = "hops"
version = "0.1.0"
edition = "2021"
description = "Generic 2/3-hop dispatcher over supported venues. Does not replace OUR_EXEC."
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "hops"

[dependencies]
pinocchio = { version = "0.8", default-features = false }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
overflow-checks = false
panic = "abort"
strip = true
