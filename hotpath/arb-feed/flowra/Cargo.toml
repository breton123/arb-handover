[package]
name = "flowra_probe"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "flowra_probe"
path = "src/main.rs"

[[bin]]
name = "flowra_replay"
path = "src/bin/flowra_replay.rs"

[dependencies]
bs58 = "0.5"
ed25519-dalek = "2"
libc = "0.2"
prost = "0.13"
prost-types = "0.13"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
ureq = { version = "2", default-features = true }

[build-dependencies]
tonic-build = "0.12"
